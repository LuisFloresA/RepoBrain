name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint-test:
    name: Backend (lint + test + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check app tests workers
      - name: Pytest + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Build check (pip wheel)
        run: pip install build && python -m build --wheel

  frontend-lint-test:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t repobrain-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t repobrain-frontend:ci ./frontend
      - name: Validate compose
        run: docker compose config --quiet
